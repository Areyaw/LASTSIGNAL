<style>

#warn.on{animation:pl 1s infinite}@keyframes pl{50%{opacity:.7}}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000d;z-index:10;text-align:center;padding:16px;overflow:auto}
h1{font-family:Anton,Impact,'Haettenschweiler','Arial Black',sans-serif;font-weight:400;font-synthesis:none;font-size:clamp(44px,11vw,88px);line-height:.95;margin:0 0 6px;color:#f4ecd8;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 0 #7a1f14,0 5px 0 #4a1109,0 10px 22px #000c}

.ov.side{align-items:flex-start;justify-content:center;text-align:left;padding:16px 16px 16px max(22px,6vw)}
#menu{background:linear-gradient(90deg,#050d14f2 0%,#08141dcc 34%,#0b1d2a33 62%,#0b1d2a00 100%)}

.side .b{display:block;box-sizing:border-box;width:min(250px,76vw);margin:5px 0;text-align:left;letter-spacing:.08em}
.side p{margin:0 0 18px;font-size:13px;max-width:300px;line-height:1.4}
.box{background:#183548;border:4px solid #fff;padding:14px;max-width:420px;width:94%;box-sizing:border-box;max-height:calc(100dvh - 24px);overflow-y:auto;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch}
.it{display:flex;justify-content:space-between;font-size:14px;padding:2px 6px}
@media (max-height:420px){h1{font-size:34px}.side p{margin-bottom:8px}.side .b{padding:7px 14px;min-height:38px;margin:3px 0}#act{width:80px;height:80px}#joy{width:120px;height:120px}#knob{left:35px;top:35px}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.slot{position:relative;aspect-ratio:1;background:#0006;border:3px solid #8aa;display:flex;align-items:center;justify-content:center}.slot.sel{border-color:#ffd75e;background:#ffd75e22}.slot.emp{border-color:#456;background:#0003}.slot b{position:absolute;right:4px;bottom:1px;font-size:15px;text-shadow:2px 2px #000}.ic{font-size:30px}.det{background:#0004;border:2px solid #fff6;padding:8px;text-align:left;min-height:90px}.hs{display:inline-block;margin:1px 2px;background:#0006;padding:1px 4px;border:1px solid #fff6}.hs b{margin-left:2px}</style></head><body>
<canvas id="g"></canvas><div id="warn"></div>
<div id="ui" style="display:none">
<div id="hud"><div class="bar"><i id="bh" style="background:#e8a33d"></i><span>LAPAR</span></div><div class="bar"><i id="bt" style="background:#3aa0e0"></i><span>HAUS</span></div><div class="bar"><i id="be" style="background:#5fd35f"></i><span>ENERGI</span></div><div id="res"></div><div id="mapw"><canvas id="mm" width="90" height="68"></canvas><button class="b" id="bB">🎒</button></div></div>

<div class="ov side" id="menu"><h1>LAST<span class="sub">SIGNAL</span></h1><p style="color:#9cd">Endro, nelayan terdampar. Perbaiki menara sinyal.</p><button class="b" id="mPlay">PLAY</button><button class="b" id="mCont">CONTINUE</button><button class="b" id="mReset">RESET SAVE</button></div>
<div class="ov side" id="pause"><h1 style="font-size:clamp(34px,8vw,56px);margin-bottom:16px">PAUSE</h1><button class="b" onclick="setM('play')">LANJUT</button><button class="b" id="bM">🔊 SUARA: ON</button><button class="b" onclick="saveG();notify('Tersimpan')">SIMPAN</button><button class="b" onclick="newGame()">ULANG BARU</button><button class="b" onclick="toMenu()">MENU UTAMA</button></div>

<div class="ov" id="dlg"><div class="box dbox"><div class="dh"><span class="di" id="di"></span><span id="dti"></span></div><div id="dt"></div><div id="dn"></div><div id="dq"></div><div id="db"></div></div></div>

<script>
"use strict";
// ===== GAME STATE =====
const $=id=>document.getElementById(id),cv=$('g'),cx=cv.getContext('2d'),mm=$('mm'),mx=mm.getContext('2d');
const CX=1000,CY=750,RX=880,RY=640,KEY='lastsignal3';
const ITEMS=['Wood','Stone','Coconut','Raw Fish','Senter','Gunting','Battery','Cable','Antenna'];
const ICON={Wood:'🪵',Stone:'🪨',Coconut:'🥥','Raw Fish':'🐟',Battery:'🔋',Cable:'🔌',Antenna:'📡',Senter:'🔦',Gunting:'✂️'};
const REC={fire:{n:'Campfire',c:{Wood:5,Stone:3}},shelter:{n:'Shelter',c:{Wood:10,Stone:5}}};
const LBL={tree:'TEBANG',palm:'PETIK',rock:'PECAH',fish:'PANCING',radio:'RADIO',tower:'MENARA',cave:'GUA',boat:'PERAHU',item:'AMBIL',fire:'MASAK',shelter:'ISTIRAHAT',river:'MINUM'};
const RV=[[640,420],[610,520],[590,620],[610,720],[640,820],[630,920],[650,1010]];
let LW=[],D=[],chop=null,s=null,O=[],RP=[],mode='menu',jx=0,jy=0,keys={},face=1,P=[],lastAct=0,mute=false,VW,VH,DPR,Z,camX=1000,camY=1100,T=0,es=0,moving=0,fr=0,lastLbl='',saveT=0,low={};
const FR=a=>1+.08*Math.sin(2*a+.7)+.06*Math.sin(3*a+2)+.04*Math.sin(5*a+1)+.025*Math.sin(9*a);
const LF=a=>1+.1*Math.sin(2*a+1)+.08*Math.sin(3*a+.3)+.05*Math.sin(5*a+2)+.03*Math.sin(7*a);
const LCX=730,LCY=720,LX=150,LY=105;
const inLake=(x,y,k)=>{const nx=(x-LCX)/LX,ny=(y-LCY)/LY;return Math.hypot(nx,ny)<LF(Math.atan2(ny,nx))*k};
function lpath(k){cx.beginPath();for(let i=0;i<=72;i++){const a=i/72*6.2832,r=LF(a)*k,x=LCX+Math.cos(a)*LX*r,y=LCY+Math.sin(a)*LY*r;i?cx.lineTo(x,y):cx.moveTo(x,y)}}
const land=(x,y,k)=>{const nx=(x-CX)/RX,ny=(y-CY)/RY;return Math.hypot(nx,ny)<FR(Math.atan2(ny,nx))*k};
const grass=(x,y)=>{const nx=(x-CX)/RX,ny=(y-CY+60)/(RY*.9);return Math.hypot(nx,ny)<FR(Math.atan2(ny,nx))*.8};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// ===== AUDIO =====
let AC;function snd(f,d,ty,v){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.1));o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.1))}catch(e){}}
// ===== WORLD GENERATION =====
function gen(){O=[];RP=[];for(let gx=LCX-LX*1.4;gx<=LCX+LX*1.4;gx+=24)for(let gy=LCY-LY*1.4;gy<=LCY+LY*1.4;gy+=24)if(inLake(gx,gy,1.12))RP.push([gx,gy]);
 LW=[];const rl=rng(5);for(let c=0,g=0;c<14&&g++<500;){const x=LCX+(rl()*2-1)*LX*1.3,y=LCY+(rl()*2-1)*LY*1.3;if(inLake(x,y,.8)){LW.push({x,y,i:c%4});c++}}
 const r=rng(11);let id=0;const add=(t,x,y,rad,o)=>{const e=Object.assign({id:id++,t,x,y,r:rad,d:0},o);O.push(e);return e};
 add('boat',900,1135,30,{solid:1});add('radio',950,1100,10);add('tower',1000,300,20,{solid:1});add('cave',1500,590,30,{solid:1});
 add('item',1560,650,10,{n:'Battery'});add('item',520,640,10,{n:'Cable'});add('item',1190,380,10,{n:'Antenna'});
 const ok=(x,y,m)=>{if(!land(x,y,.86)||Math.hypot(x-940,y-1120)<110||Math.hypot(x-1000,y-300)<110)return 0;for(const o of O)if(Math.hypot(o.x-x,o.y-y)<m)return 0;for(const p of RP)if(Math.hypot(p[0]-x,p[1]-y)<40)return 0;return 1};
 const sc=(t,n,rad,m,md)=>{let c=0,g=0;while(c<n&&g++<4000){const x=CX+(r()*2-1)*RX*.85,y=CY+(r()*2-1)*RY*.85;if(ok(x,y,m)&&(md==1?grass(x,y):md==2?!grass(x,y):1)){add(t,x,y,rad,{solid:1});c++}}};
 sc('tree',26,12,70,1);sc('palm',10,9,50,2);sc('rock',14,11,44,1);
  for(let i=0,g=0;i<6&&g++<300;){const a=r()*6.283,f=FR(a)*.95,x=CX+Math.cos(a)*RX*f,y=CY+Math.sin(a)*RY*f;if(land(x,y,.97)&&Math.hypot(x-1000,y-300)>130&&Math.hypot(x-940,y-1120)>100){add('fish',x,y,12,{cd:0});i++}}
 D=[];const r2=rng(99),dk=k=>DS.filter(d=>d.k==k);
 for(let c=0,g=0;c<170&&g++<4000;){const x=CX+(r2()*2-1)*RX*1.1,y=CY+(r2()*2-1)*RY*1.1,t=c<85?'g':c<125?'f':'p';if(!(t=='p'?land(x,y,.92):(grass(x,y)&&land(x,y,.9))))continue;if(RP.some(p=>Math.hypot(p[0]-x,p[1]-y)<22))continue;const L=dk(t);D.push({x,y,d:L[(r2()*L.length)|0]});c++}
 for(let c=0,g=0;c<130&&g++<4000;){const x=CX+(r2()*2-1)*RX*1.1,y=CY+(r2()*2-1)*RY*1.1;if(!land(x,y,.96)||grass(x,y)||RP.some(p=>Math.hypot(p[0]-x,p[1]-y)<22))continue;const L=dk('s');D.push({x,y,d:L[(r2()*L.length)|0]});c++}
 O.sort((a,b)=>a.y-b.y)}
function addPlaced(){for(const k of['fire','shelter'])if(s.pl[k]){const p=s.pl[k];O.push({id:k=='fire'?1000:1001,t:k,x:p[0],y:p[1],r:10,d:0});}O.sort((a,b)=>a.y-b.y)}
// ===== COLLISION / MOVEMENT =====
function mv(ax,ay){const nx=s.x+ax,ny=s.y+ay;if(!land(nx,ny,.97)||inLake(nx,ny,1.03))return;if(nx>720&&nx<1290&&ny<272)return;for(const o of O)if(o.solid&&!o.d&&Math.abs(o.x-nx)<50&&Math.abs(o.y-ny)<50&&Math.hypot(o.x-nx,o.y-ny)<o.r+7)return;s.x=nx;s.y=ny}
// ===== INVENTORY / UI HELPERS =====
let NT=[],bub=null;
function notify(m){NT.push({m,t:Date.now()});if(NT.length>4)NT.shift()}
function say(m,d){bub={m,t:Date.now(),d:d||2400}}
const pick=a=>a[Math.random()*a.length|0];
const LN={ct:['Hup... tebang!','Pohon ini kuat juga...','Pakai tenaga dulu!'],dt:['Dapat kayu!','Lumayan buat api unggun.'],cp:['Semoga kelapanya manis...','Ayo, turun kelapa!'],dp:['Segarnya, kelapa!','Dapat kelapa!'],r:['Batunya keras...','Ini bisa jadi api unggun.'],f:['Semoga ada ikan!','Nah, dapat ikan!'],dr:['Segarnya!','Air danau... lumayan.'],k:['Wangi sekali!','Ikan bakar, mantap.'],Battery:['Battery! Semoga masih nyala.'],Cable:['Kabelnya cukup panjang.'],Antenna:['Antenna! Hampir lengkap.']};
function burst(x,y,c){for(let i=0;i<8;i++)P.push({x,y,vx:(Math.random()-.5)*60,vy:-Math.random()*60,l:.6,c})}
function give(n,k){s.inv[n]+=k;notify('+'+k+' '+n);burst(s.x,s.y-8,'#ffd75e');snd(660,.1);if(s.inv.Wood>=5&&s.inv.Stone>=3)s.f.mat=1}
function dlg(m,b,o){o=o||{};setM('dlg');$('dt').textContent=m;$('di').textContent=o.i||'💬';$('dti').textContent=o.t||'Info';const nn=$('dn');nn.innerHTML='';(o.n||[]).forEach(x=>{const e=document.createElement('span'),h=s.inv[x[0]]||0;e.className='chip'+(h>=x[1]?' ok':'');e.textContent=(h>=x[1]?'✓ ':'')+ICON[x[0]]+' '+x[0]+' '+Math.min(h,x[1])+'/'+x[1];nn.appendChild(e)});const q=$('dq');q.innerHTML='';if(o.qh)q.innerHTML='<div class="ql" style="padding:0 0 4px">MISI</div>'+o.qh;const d=$('db');d.innerHTML='';(b||[['OK']]).forEach(x=>{const e=document.createElement('button');e.className='b';e.textContent=x[0];e.onclick=()=>{setM('play');if(x[1])x[1]()};d.appendChild(e)})}
function setM(m){chop=null;mode=m;for(const k of['pause','over','win','dlg','bag','menu'])$(k).style.display=(k==m||(m=='dlg'&&k=='dlg'))?'flex':'none';$('ui').style.display=(m=='menu')?'none':'block';if(m=='bag')bagR()}
let sel='Coconut';
const DESC={Wood:'Kayu. Bahan untuk Campfire dan Shelter. Didapat dari menebang pohon.',Stone:'Batu. Bahan untuk Campfire dan Shelter. Pecahkan batu di hutan.',Coconut:'Kelapa. Mengurangi lapar dan haus. Pencet GUNAKAN untuk memakannya.','Raw Fish':'Ikan mentah. Dekati Campfire lalu tekan MASAK agar jadi makanan kenyang.',Battery:'Item misi untuk menara sinyal. Ada di dalam kardus dekat gua (timur). Kardus harus digunting.',Cable:'Item misi untuk menara sinyal. Ada di dalam kardus dekat danau (barat). Kardus harus digunting.',Antenna:'Item misi untuk menara sinyal. Ada di dalam kardus di bukit (utara). Butuh Kabel sebagai tali untuk memanjat.',Senter:'Senter yang kamu temukan di menara. Dipakai untuk masuk ke gua gelap di timur.',Gunting:'Gunting dari dalam gua. Dipakai untuk membuka kardus-kardus bekas bangkai pesawat.'};
function selI(n){sel=n;snd(600,.05);bagR()}
function bagR(){s.order=(s.order||[]).filter(n=>s.inv[n]>0);for(const n of ITEMS)if(s.inv[n]>0&&!s.order.includes(n))s.order.push(n);const od=s.order;if(!od.includes(sel))sel=od[0]||null;
 let g='';for(let k=0;k<12;k++){const n=od[k];g+=n?`<div class="slot${n==sel?' sel':''}" onclick="selI('${n}')"><span class="ic">${ICON[n]}</span><b>${s.inv[n]}</b></div>`:'<div class="slot emp"></div>'}
 let h=`<div class="grid">${g}</div><div class="det">`+(sel?`<b>${ICON[sel]} ${sel} x${s.inv[sel]}</b><div style="font-size:12px;margin:4px 0">${DESC[sel]}</div>`+(sel=='Coconut'?'<button class="b" onclick="eatC()">GUNAKAN</button>':''):'<div style="font-size:12px">Tas masih kosong. Kumpulkan item dulu: tebang pohon, pecah batu, ambil kelapa.</div>')+'</div><hr>';
 for(const k in REC){const c=REC[k].c,can=!s.pl[k]&&Object.keys(c).every(i=>s.inv[i]>=c[i]);h+=`<button class="b" style="font-size:13px" onclick="craft('${k}')" ${can?'':'disabled'}>${REC[k].n} (${Object.entries(c).map(e=>e[1]+' '+e[0]).join('+')})${s.pl[k]?' ✔':''}</button><br>`}h+='<br><button class="b" onclick="setM(\'play\')">TUTUP</button>';$('bc').innerHTML=h}
function eatC(){if(s.inv.Coconut<1)return;s.inv.Coconut--;s.hunger=Math.min(100,s.hunger+12);s.thirst=Math.min(100,s.thirst+22);snd(400,.15);bagR()}
function craft(k){const c=REC[k].c;if(s.pl[k]||!Object.keys(c).every(i=>s.inv[i]>=c[i]))return;for(const i in c)s.inv[i]-=c[i];s.pl[k]=[s.x,s.y];addPlaced();notify(REC[k].n+' dibuat!');say(k=='fire'?'Akhirnya ada api unggun!':'Tempat berteduh jadi!');snd(300,.2,'sawtooth');bagR();saveG()}
// ===== QUEST =====
const QN=11;

function drawWreck(x,y){const bx=x+10,by=y-135,sw=Math.sin(T*1.6);
 // bayangan/air gelap di sekitar bangkai
 ell(bx,by+34,210,34,'#0a3a4a55');

 cx.fillStyle='#6f777d';cx.beginPath();cx.moveTo(-190,34);cx.lineTo(-200,48);cx.lineTo(-176,46);cx.fill();

 for(let i=0;i<11;i++)rc(-110+i*19,-30,9,10,i==4||i==8?'#1d252b':'#4a6d8a');

 cx.fillStyle='#4db3c866';cx.beginPath();cx.moveTo(bx+30,by+36);for(let i=0;i<=11;i++)cx.lineTo(bx+30+i*16,by+36+Math.sin(T*2.4+i*1.3)*2.5);cx.lineTo(bx+206,by+68);cx.lineTo(bx+30,by+68);cx.fill();
 cx.strokeStyle='#ffffffaa';cx.lineWidth=2;cx.beginPath();for(let i=0;i<=11;i++){const px=bx+30+i*16,py=by+36+Math.sin(T*2.4+i*1.3)*2.5;i?cx.lineTo(px,py):cx.moveTo(px,py)}cx.stroke();
